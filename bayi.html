<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>Sipariş Takip · Kılıçoğlu Kuyumculuk</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0A09;--kart:#15130F;--kart2:#1C1912;--cizgi:rgba(212,175,55,.22);--metin:#F2ECDD;--soluk:#A39A85;--altin:#F5C451;--altin2:#C9A132;--yesil:#34D399;--mavi:#60A5FA;--kirmizi:#F87171;--sari:#FBBF24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:radial-gradient(900px 420px at 85% -10%,rgba(245,196,81,.10),transparent 60%),var(--bg);color:var(--metin);min-height:100vh;font-variant-numeric:tabular-nums}
.sar{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:14px;padding:6px 0 18px;border-bottom:1px solid var(--cizgi);margin-bottom:18px;flex-wrap:wrap}
.logo{width:64px;height:56px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo img{max-width:58px;max-height:50px;object-fit:contain}
.logo.harf{background:linear-gradient(135deg,#3A2E14,#8C6D23);color:#fff;font-weight:800;font-size:20px}
.baslik h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.baslik p{font-size:12.5px;color:var(--soluk);margin-top:2px}
.baslik p b{font-family:'DM Serif Display',serif;font-weight:400;color:var(--altin);letter-spacing:.06em;font-size:13.5px}
.sag{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--soluk)}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(135deg,#F3D27A,#C9A132);color:#1A1408;border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px}
.btn:disabled{opacity:.6}
.kartlar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media(max-width:820px){.kartlar{grid-template-columns:1fr}}
.k{--k:var(--altin);border-radius:16px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--k) 45%,transparent);background:radial-gradient(220px 110px at 100% 0%,color-mix(in srgb,var(--k) 18%,transparent),transparent 65%),var(--kart)}
.k .u{font-size:12px;font-weight:700;color:var(--k);letter-spacing:.02em}
.k .d{font-size:26px;font-weight:800;margin-top:4px}
.k .d small{font-size:13px;font-weight:600;color:var(--soluk)}
.k .a{font-size:12px;color:var(--soluk);margin-top:3px}
.k.yesil{--k:var(--yesil)}.k.mavi{--k:var(--mavi)}.k.mor{--k:#A5B4FC}
.sekmeler{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sekmeler button{background:rgba(255,255,255,.04);border:1px solid var(--cizgi);color:#E8DFC8;border-radius:22px;padding:7px 15px;font-size:13px;font-weight:600}
.sekmeler button.aktif{background:linear-gradient(135deg,#F3D27A,#C9A132);color:#1A1408;border-color:transparent}
.sekmeler .say{display:inline-block;min-width:18px;padding:0 6px;border-radius:10px;background:rgba(0,0,0,.25);font-size:11px;margin-left:4px}
.arac{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.arac input,.arac select{background:var(--kart);border:1px solid var(--cizgi);color:var(--metin);border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px}
.arac input{flex:1;min-width:180px}
.tablo{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;overflow:hidden}
.tablo-ic{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;font-weight:700;color:var(--soluk);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:11px 12px;background:var(--kart2);white-space:nowrap}
td{padding:11px 12px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
td.s,th.s{text-align:right;white-space:nowrap}
tr.top td{font-weight:800;color:var(--altin);background:rgba(245,196,81,.05)}
.bos{padding:34px 16px;text-align:center;color:var(--soluk);font-size:14px}
.rozet{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.r-bek{background:rgba(245,196,81,.15);color:var(--altin)}.r-yeni{background:rgba(251,146,60,.15);color:#FDBA74}.r-kar{background:rgba(52,211,153,.14);color:var(--yesil)}.r-yok{color:#7A7466}
.son{font-size:11.5px;color:var(--soluk);margin-top:3px}.son.yakin{color:var(--sari)}.son.gecti{color:var(--kirmizi)}
.alt{font-size:12px;color:var(--soluk)}
.tip{font-size:12px;color:#C9BFA8}
.urun{display:flex;align-items:center;gap:10px;min-width:170px}
.foto{width:44px;height:44px;border-radius:9px;object-fit:cover;background:#fff;flex-shrink:0;cursor:zoom-in}
.foto.k{width:34px;height:34px;border-radius:7px}
.buyuk{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.buyuk img{width:min(260px,80vw);border-radius:14px;background:#fff}
.gonderi li .sol{display:flex;align-items:center;gap:9px}
.gonderi{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.gonderi .ust{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.gonderi .ust b{font-size:15px}
.takip{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mavi);text-decoration:none;border-bottom:1px dotted var(--mavi)}
.gonderi ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.gonderi li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid rgba(255,255,255,.05)}
.arti{color:var(--altin)}.eksi{color:var(--yesil)}
.hata{max-width:440px;margin:18vh auto 0;text-align:center;padding:30px 22px;background:var(--kart);border:1px solid var(--cizgi);border-radius:18px}
.hata h2{font-size:20px;margin-bottom:8px}.hata p{color:var(--soluk);font-size:14px;line-height:1.55}
.yuk{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22vh;color:var(--soluk)}
.dn{width:18px;height:18px;border:2px solid rgba(245,196,81,.3);border-top-color:var(--altin);border-radius:50%;animation:d 1s linear infinite}
@keyframes d{to{transform:rotate(360deg)}}
.logolar{display:flex}.logolar .logo+.logo{margin-left:-14px;box-shadow:0 0 0 3px var(--bg)}
.logo.kucuk{width:38px;height:34px;border-radius:9px}.logo.kucuk img{max-width:34px;max-height:30px}.logo.harf.kucuk{font-size:13px}
.toplam{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.toplam .k{background:radial-gradient(260px 120px at 100% 0%,color-mix(in srgb,var(--k) 24%,transparent),transparent 65%),var(--kart2)}
.magazalar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.magazalar button{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 14px;border-radius:14px;border:1px solid var(--cizgi);background:var(--kart);color:var(--metin)}
.magazalar button span{display:flex;flex-direction:column;gap:2px}.magazalar button small{font-size:12px;color:var(--soluk)}
.magazalar button.aktif{border-color:var(--altin);background:linear-gradient(135deg,rgba(245,196,81,.16),rgba(201,161,50,.06));box-shadow:0 0 0 1px var(--altin) inset}
.secili-baslik{display:flex;align-items:center;gap:10px;font-size:15px;margin:2px 0 10px;color:var(--altin)}
@media(max-width:820px){.toplam{grid-template-columns:1fr}}

/* müşteri sipariş gönderme */
.btn.ekle{background:linear-gradient(135deg,#34D399,#059669);color:#04130C;font-size:14px;padding:10px 16px;box-shadow:0 6px 18px -6px rgba(52,211,153,.55)}
.gelen{background:var(--kart);border:1px solid rgba(52,211,153,.35);border-radius:16px;padding:12px 16px;margin-bottom:16px}
.gelen .ust{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.gelen ul{list-style:none;display:flex;flex-direction:column}
.gelen li{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
.gelen li .ad{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gelen li button{background:none;border:1px solid rgba(248,113,113,.4);color:var(--kirmizi);border-radius:8px;padding:3px 9px;font-size:12px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .ic{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;padding:18px}
.modal h3{font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.modal .x{margin-left:auto;background:rgba(255,255,255,.06);border:1px solid var(--cizgi);color:var(--metin);border-radius:10px;width:34px;height:34px}
.birak{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:34px 16px;margin:12px 0;border:2px dashed rgba(52,211,153,.55);border-radius:16px;background:rgba(52,211,153,.05);cursor:pointer;transition:.15s}
.birak:hover,.birak.ust{background:rgba(52,211,153,.13);border-color:var(--yesil)}
.birak b{font-size:16px}.birak span{font-size:12.5px;color:var(--soluk)}
.birak .ikon{font-size:38px}
.yukleme{list-style:none;display:flex;flex-direction:column;gap:6px}
.yukleme li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--kart2);font-size:13px}
.yukleme li .ad{flex:1;min-width:0}.yukleme li .ad small{display:block;color:var(--soluk);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yukleme .ok{color:var(--yesil);font-weight:700}.yukleme .uy{color:var(--sari);font-weight:700}.yukleme .hz{color:var(--kirmizi);font-weight:700}
.surukle-kaplama{position:fixed;inset:0;z-index:55;background:rgba(5,40,28,.82);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#D1FAE5;font-size:22px;font-weight:800;border:4px dashed var(--yesil)}
.surukle-kaplama.acik{display:flex}
footer{margin-top:26px;text-align:center;font-size:11.5px;color:#6F685A}
@media(max-width:640px){
  .gizle-m{display:none}
  td,th{padding:9px 8px}
  .k .d{font-size:22px}
}
</style>

<body>
<div class="sar" id="kok"><div class="yuk"><div class="dn"></div>Yükleniyor…</div></div>
<script>
const SUPABASE_URL = 'https://xufyzwioeguudrynkjvc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jQeVQUHMze43X1cwak2ELA_VHTCMqyV';
let V = null, sekme = 'tum', ara = '', ayFiltre = '';
let ORTAK = null, ortakSecili = '';
let FIS = { acik: false, fisler: [] }, fisYukleme = [];   // müşteriden sipariş fişi gönderme   // ortak link: birden fazla mağaza (bayi.html#ortak=<anahtar>)

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = v => Number(v) || 0;
const hasF = v => n(v).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 3 });
const grF = v => n(v).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usdF = v => (n(v) < -0.004 ? '−$' : '$') + Math.abs(n(v)).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const tarihF = t => { if (!t) return '—'; const [y, a, g] = String(t).slice(0, 10).split('-'); return g + '.' + a + '.' + y; };
const ayAd = ay => { const [y, a] = ay.split('-').map(Number); return new Date(y, a - 1, 1).toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' }); };
const tipAd = t => String(t || '').replace(/\|?TAŞ:[\d.]+/, '').replace(/\|$/, '').trim();
const tasGr = t => { const m = String(t || '').match(/TAŞ:([\d.]+)/); return m ? parseFloat(m[1]) : 0; };

function linkBilgi() {
  const h = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
  const m = h.match(/^ortak=(.+)$/);
  return m ? { ortak: true, t: m[1].trim() } : { ortak: false, t: h.replace(/^t=/, '') };
}

async function yukle(sessiz) {
  const { ortak, t } = linkBilgi();
  if (t.length < 32) return hata('Link eksik', 'Bu sayfayı size gönderilen tam linkle açın.');
  const btn = document.getElementById('yenile'); if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + (ortak ? 'bayi_portal_ortak' : 'bayi_portal'), {
      method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: t }), referrerPolicy: 'no-referrer', cache: 'no-store'
    });
    if (!r.ok) throw new Error('Sunucu yanıtı: ' + r.status);
    const d = await r.json();
    if (!d) return hata('Link geçersiz', 'Bu link kapatılmış ya da yenilenmiş olabilir. Güncel link için Kılıçoğlu Kuyumculuk ile iletişime geçin.');
    if (ortak) {
      if (!Array.isArray(d.magazalar) || !d.magazalar.length) return hata('Gösterilecek mağaza yok', 'Bu linkteki mağazalar şu an kapalı. Kılıçoğlu Kuyumculuk ile iletişime geçin.');
      ORTAK = d;
      const sec = d.magazalar.find(m => m.platform === ortakSecili) || d.magazalar[0];
      ortakSecili = sec.platform; V = sec;
    } else { ORTAK = null; V = d; }
    await fisDurumYukle();
    ciz();
  } catch (e) {
    if (!sessiz || !V) hata('Bağlantı kurulamadı', 'İnternet bağlantınızı kontrol edip sayfayı yenileyin.');
  }
}
function hata(b, m) { document.getElementById('kok').innerHTML = `<div class="hata"><h2>${esc(b)}</h2><p>${esc(m)}</p></div>`; }

function hesap(v) {
  v = v || V;
  const sip = v.siparisler || [], gon = v.gonderiler || [], od = v.odemeler || [];
  const hasBorc = sip.reduce((t, s) => t + n(s.has), 0) - od.reduce((t, o) => t + n(o.has), 0);
  const usdBorc = gon.reduce((t, g) => t + n(g.kargo_usd), 0) - od.reduce((t, o) => t + n(o.usd), 0);
  const bek = sip.filter(s => s.durum === 'bekliyor').sort((a, b) => String(a.tarih).localeCompare(String(b.tarih)));
  const buAy = new Date().toISOString().slice(0, 7);
  const kargoAy = sip.filter(s => s.durum === 'kargolandi' && String(s.kargo_tarihi || '').slice(0, 7) === buAy).length;
  return { sip, gon, od, hasBorc, usdBorc, bek, kargoAy, buAy };
}
function eslesir(s) {
  if (!ara) return true;
  const q = ara.toLocaleLowerCase('tr-TR');
  return [s.siparis_no, s.urun, tipAd(s.tip)].some(x => String(x || '').toLocaleLowerCase('tr-TR').includes(q));
}
function durumRozet(s) {
  if (s.durum === 'bekliyor' && s.asama !== undefined) return s.asama === 'hazirlaniyor' ? '<span class="rozet r-bek">🛠 Hazırlanıyor</span>' : '<span class="rozet r-yeni">🆕 Sipariş alındı</span>';
  if (s.durum === 'bekliyor') return '<span class="rozet r-bek">⏳ Hazırlanıyor</span>';
  if (s.durum === 'kargolandi') return '<span class="rozet r-kar">🚚 Kargolandı</span>';
  return '<span class="rozet r-yok">—</span>';
}
function sonRozet(s) {
  if (s.durum !== 'bekliyor' || !s.son_gonderim) return '';
  const gun = Math.ceil((new Date(s.son_gonderim + 'T23:59:59') - new Date()) / 86400000);
  const cls = gun < 0 ? 'gecti' : gun <= 2 ? 'yakin' : '';
  return `<div class="son ${cls}">Son gönderim ${tarihF(s.son_gonderim)}${gun < 0 ? ' · geçti' : gun === 0 ? ' · bugün' : ' · ' + gun + ' gün'}</div>`;
}
function takipLink(g) {
  if (!g.takip_no) return '<span class="alt">takip no yok</span>';
  const no = encodeURIComponent(g.takip_no), f = String(g.firma || '').toLowerCase();
  const url = f.includes('ups') ? 'https://www.ups.com/track?tracknum=' + no
    : f.includes('dhl') ? 'https://www.dhl.com/tr-tr/home/tracking/tracking-express.html?tracking-id=' + no
    : f.includes('fedex') ? 'https://www.fedex.com/fedextrack/?trknbr=' + no : '';
  return url ? `<a class="takip" href="${url}" target="_blank" rel="noopener noreferrer">${esc(g.takip_no)} ↗</a>` : `<span class="takip" style="border:none">${esc(g.takip_no)}</span>`;
}
function fotoImg(s, k) { return /^data:image\//.test(s.foto || '') ? `<img class="foto ${k || ''}" src="${s.foto}" alt="" onclick="buyut(this.src)">` : ''; }
function buyut(src) { const d = document.createElement('div'); d.className = 'buyuk'; d.onclick = () => d.remove(); const i = document.createElement('img'); i.src = src; d.appendChild(i); document.body.appendChild(d); }
function kargoVar() { return (V.gonderiler || []).length > 0 || (V.siparisler || []).some(s => s.durum); }
function siparisTablo(liste, kargoKolon) {
  const durumKolon = kargoVar(); kargoKolon = kargoKolon && durumKolon;
  if (!liste.length) return `<div class="tablo"><div class="bos">${ara ? 'Aramanızla eşleşen sipariş yok.' : 'Burada gösterilecek sipariş yok.'}</div></div>`;
  const gonHarita = Object.fromEntries((V.gonderiler || []).map(g => [String(g.id), g]));
  const tg = liste.reduce((t, s) => t + n(s.gram), 0), th = liste.reduce((t, s) => t + n(s.has), 0);
  return `<div class="tablo"><div class="tablo-ic"><table>
    <tr><th>Tarih</th><th>Sipariş</th><th>Ürün</th><th class="s">Gram</th><th class="s gizle-m">Milyem</th><th class="s">Has</th>${durumKolon ? '<th>Durum</th>' : ''}${kargoKolon ? '<th>Kargo</th>' : ''}</tr>
    ${liste.map(s => { const g = s.gonderi_id != null ? gonHarita[String(s.gonderi_id)] : null; const tas = tasGr(s.tip); return `<tr>
      <td style="white-space:nowrap">${tarihF(s.tarih)}</td>
      <td style="white-space:nowrap">${s.siparis_no ? '#' + esc(s.siparis_no) : '<span class="alt">—</span>'}</td>
      <td><div class="urun">${fotoImg(s)}<div>${esc(s.urun || '')}<div class="tip">${esc(tipAd(s.tip))}${tas ? ' · taş ' + grF(tas) + ' gr' : ''}</div></div></div></td>
      <td class="s">${grF(s.gram)}</td>
      <td class="s gizle-m">${n(s.milyem) ? n(s.milyem).toFixed(3) : '—'}</td>
      <td class="s"><b>${hasF(s.has)}</b></td>
      ${durumKolon ? `<td>${durumRozet(s)}${sonRozet(s)}${s.durum === 'kargolandi' && s.kargo_tarihi ? `<div class="son">${tarihF(s.kargo_tarihi)}</div>` : ''}</td>` : ''}
      ${kargoKolon ? `<td>${g ? esc(g.firma || '') + ' ' + takipLink(g) : '<span class="alt">—</span>'}</td>` : ''}
    </tr>`; }).join('')}
    <tr class="top"><td colspan="3">Toplam · ${liste.length} sipariş</td><td class="s">${grF(tg)}</td><td class="gizle-m"></td><td class="s">${hasF(th)}</td><td colspan="${(durumKolon ? 1 : 0) + (kargoKolon ? 1 : 0)}"></td></tr>
  </table></div></div>`;
}
function gonderilerHtml(h) {
  if (!h.gon.length) return '<div class="tablo"><div class="bos">Henüz gönderi yok.</div></div>';
  return h.gon.map(g => {
    const sip = h.sip.filter(s => String(s.gonderi_id) === String(g.id) && eslesir(s));
    if (ara && !sip.length) return '';
    return `<div class="gonderi"><div class="ust"><b>📦 ${tarihF(g.tarih)}</b><span>${esc(g.firma || '')}</span>${takipLink(g)}<span style="margin-left:auto" class="alt">${sip.length || g.siparis_sayisi || 0} sipariş${n(g.kargo_usd) ? ' · kargo ' + usdF(g.kargo_usd) : ''}</span></div>
      <ul>${sip.map(s => `<li><span class="sol">${fotoImg(s, 'k')}<span>${s.siparis_no ? '#' + esc(s.siparis_no) + ' · ' : ''}${esc(s.urun || '')} <span class="alt">${esc(tipAd(s.tip))}</span></span></span><span>${grF(s.gram)} gr · <b>${hasF(s.has)}</b> has</span></li>`).join('') || '<li><span class="alt">Sipariş bilgisi yok</span></li>'}</ul></div>`;

function hareketlerHtml(h) {

  h.gon.forEach(g => n(g.kargo_usd) && har.push({ t: g.tarih, ac: 'Kargo · ' + (g.firma || '') + (g.takip_no ? ' ' + g.takip_no : ''), has: 0, usd: n(g.kargo_usd) }));
  h.od.forEach(o => { const ek = n(o.has) < 0 || n(o.usd) < 0, kargo = ek && /^Kargo\b/.test(o.aciklama || ''); har.push({ t: o.tarih, ac: kargo ? o.aciklama : (ek ? 'Ek borç' : 'Ödeme') + (o.aciklama ? ' · ' + o.aciklama : ''), has: -n(o.has), usd: -n(o.usd), odeme: !ek }); });
  har.sort((a, b) => String(a.t).localeCompare(String(b.t)));
  let bh = 0, bu = 0; har.forEach(x => { bh += x.has; bu += x.usd; x.bh = bh; x.bu = bu; });
  const liste = har.reverse().filter(x => !ayFiltre || String(x.t).slice(0, 7) === ayFiltre).filter(x => !ara || x.ac.toLocaleLowerCase('tr-TR').includes(ara.toLocaleLowerCase('tr-TR')));

  const ortakHtml = ORTAK ? (() => {

      <div class="baslik"><h1>${esc(ORTAK ? (ORTAK.magazalar.map(m => m.ad).join(' & ')) : (V.ad || 'Sipariş Takip'))}</h1><p><b>KILIÇOĞLU</b> · Sipariş ve hesap takibi</p></div>

function sekmeSec(s) { sekme = s; ayFiltre = ''; ciz(); }
async function magazaSec(p) {
  if (!ORTAK || p === ortakSecili) return;
  const m = ORTAK.magazalar.find(x => x.platform === p); if (!m) return;
  ortakSecili = p; V = m; sekme = 'tum'; ayFiltre = ''; ara = ''; ciz();

// ===== Sipariş ekle: Etsy sipariş fişlerini (PDF) gönder =====
async function rpc(ad, govde) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + ad, { method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(govde), referrerPolicy: 'no-referrer', cache: 'no-store' });
  if (!r.ok) throw new Error('Sunucu yanıtı: ' + r.status);
  return r.json();
}
async function fisDurumYukle() {
  try { const d = await rpc('bayi_fis_liste', { p_token: linkBilgi().t, p_platform: ORTAK ? ortakSecili : null }); FIS = d && d.acik ? { acik: true, fisler: d.fisler || [] } : { acik: false, fisler: [] }; }
  catch (e) { FIS = { acik: false, fisler: [] }; }   // özellik kurulmamışsa buton görünmez
}
function gelenHtml() {
  if (!FIS.acik) return '';
  const gun = 3 * 86400000;
  const liste = FIS.fisler.filter(f => f.durum === 'yeni' || (f.durum === 'eklendi' && Date.now() - new Date(f.zaman) < gun));
  if (!liste.length) return '';
  const bekleyen = liste.filter(f => f.durum === 'yeni').length;
  const etiket = f => f.siparis_no ? f.siparis_no.split(',').map(x => '#' + x).join(', ') : (f.dosya_adi || 'Fiş');
  return `<div class="gelen"><div class="ust"><b>📥 Gönderdiğiniz siparişler</b>${bekleyen ? `<span class="rozet r-yeni">${bekleyen} işleme alınmayı bekliyor</span>` : ''}</div>
    <ul>${liste.map(f => `<li><span class="ad">${esc(etiket(f))}${f.alici ? ' · ' + esc(f.alici) : ''} <span class="alt">${new Date(f.zaman).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span></span>
      ${f.durum === 'yeni' ? `<span class="rozet r-bek">⏳ Bekliyor</span><button onclick="fisIptal(${Number(f.id)})" title="Bu fişi geri çek">Geri çek</button>` : '<span class="rozet r-kar">✓ Siparişlere eklendi</span>'}</li>`).join('')}</ul></div>`;
}
async function fisIptal(id) {
  if (!confirm('Bu fiş geri çekilsin mi?')) return;
  try { await rpc('bayi_fis_iptal', { p_token: linkBilgi().t, p_platform: ORTAK ? ortakSecili : null, p_id: id }); } catch (e) { alert('Geri çekilemedi.'); }
  await fisDurumYukle(); ciz();
}
function fisModalAc() {
  if (!FIS.acik) return;
  fisYukleme = [];
  let m = document.getElementById('fisModal');
  if (!m) { m = document.createElement('div'); m.id = 'fisModal'; m.className = 'modal'; m.addEventListener('click', e => { if (e.target === m) fisModalKapat(); }); document.body.appendChild(m); }
  m.style.display = 'flex';
  fisModalCiz();
}
function fisModalKapat() { const m = document.getElementById('fisModal'); if (m) m.style.display = 'none'; if (fisYukleme.length) { fisDurumYukle().then(ciz); } }
function fisModalCiz() {
  const m = document.getElementById('fisModal'); if (!m) return;
  const durum = { bek: '<span class="alt">Sırada…</span>', oku: '<span class="alt">Okunuyor…</span>', gon: '<span class="alt">Gönderiliyor…</span>', ok: '<span class="ok">✓ Gönderildi</span>', zaten: '<span class="uy">Zaten gönderilmiş</span>', hata: '<span class="hz">✕ Gönderilemedi</span>' };
  m.innerHTML = `<div class="ic">
    <h3>＋ Sipariş ekle<button class="x" onclick="fisModalKapat()">✕</button></h3>
    <div class="alt">${ORTAK ? '<b style="color:var(--altin)">' + esc(V.ad) + '</b> mağazasına · ' : ''}Etsy'den indirdiğiniz sipariş fişlerini (PDF) buraya bırakın. Bir PDF'te birden fazla sipariş olabilir.</div>
    <label class="birak" id="birakAlan" ondragover="event.preventDefault();this.classList.add('ust')" ondragleave="this.classList.remove('ust')" ondrop="event.preventDefault();this.classList.remove('ust');fisDosyalar(event.dataTransfer.files)">
      <span class="ikon">📄</span><b>PDF'leri sürükleyip bırakın</b><span>ya da dokunup seçin · birden fazla seçebilirsiniz</span>
      <input type="file" accept="application/pdf,.pdf" multiple style="display:none" onchange="fisDosyalar(this.files);this.value=''">
    </label>
    ${fisYukleme.length ? `<ul class="yukleme">${fisYukleme.map(y => `<li><span>📄</span><span class="ad">${esc(y.etiket || y.ad)}<small>${esc(y.alt || y.ad)}</small></span>${durum[y.durum] || ''}</li>`).join('')}</ul>` : ''}
    ${fisYukleme.length && fisYukleme.every(y => !['bek', 'oku', 'gon'].includes(y.durum)) ? `<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" onclick="fisModalKapat()">Tamam</button></div>` : ''}
    <div class="alt" style="margin-top:12px;font-size:11.5px">Gönderdiğiniz siparişler Kılıçoğlu tarafından işleme alınınca listenizde görünür.</div>
  </div>`;
}
let pdfjsSoz = null;
function pdfjsYukle() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return pdfjsSoz = pdfjsSoz || new Promise((ok, red) => {
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(pdfjsLib); };
    sc.onerror = () => { pdfjsSoz = null; red(new Error('PDF okuyucu yüklenemedi')); }; document.head.appendChild(sc);
  });
}
// PDF'ten sipariş numaraları, alıcı ve ürün sayısı (sadece listede göstermek ve tekrarı önlemek için)
async function fisOzet(buf) {
  const lib = await pdfjsYukle();
  const pdf = await lib.getDocument({ data: buf.slice(0) }).promise;
  let metin = '';
  for (let i = 1; i <= pdf.numPages; i++) { const c = await (await pdf.getPage(i)).getTextContent(); metin += c.items.map(x => x.str).join('\n') + '\n'; }
  const nolar = [...new Set([...metin.matchAll(/Order\s*#\s*(\d{5,})/gi)].map(m => m[1]))];
  const satir = metin.split('\n').map(x => x.trim()).filter(Boolean);
  const i = satir.findIndex(x => /^ship to$/i.test(x));
  const alici = i >= 0 ? satir[i + 1] || '' : '';
  const urun = [...metin.matchAll(/(\d+)\s+items?\b/gi)].reduce((t, m) => t + Number(m[1]), 0);
  return { nolar, alici: nolar.length > 1 ? nolar.length + ' sipariş' : alici, urun };
}
const b64 = buf => { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
async function fisDosyalar(liste) {
  const dosyalar = [...(liste || [])].filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (!dosyalar.length) { alert('Lütfen PDF dosyası seçin (Etsy sipariş fişi).'); return; }
  if (!document.getElementById('fisModal') || document.getElementById('fisModal').style.display === 'none') fisModalAc();
  const yeni = dosyalar.map(f => ({ ad: f.name, dosya: f, durum: 'bek' }));
  fisYukleme.push(...yeni); fisModalCiz();
  for (const y of yeni) {
    try {
      if (y.dosya.size > 15 * 1024 * 1024) throw new Error('15 MB\'tan büyük');
      y.durum = 'oku'; fisModalCiz();
      const buf = await y.dosya.arrayBuffer();
      let oz = { nolar: [], alici: '', urun: 0 };
      try { oz = await fisOzet(buf); } catch (e) { /* okunamazsa da gönder; Kılıçoğlu tarafında açılır */ }
      y.etiket = oz.nolar.length ? oz.nolar.map(x => '#' + x).join(', ') : y.ad;
      y.alt = [oz.alici, oz.urun ? oz.urun + ' ürün' : '', y.ad].filter(Boolean).join(' · ');
      y.durum = 'gon'; fisModalCiz();
      const r = await rpc('bayi_fis_gonder', { p_token: linkBilgi().t, p_platform: ORTAK ? ortakSecili : null, p_dosya_adi: y.ad, p_pdf: b64(buf), p_siparis_no: oz.nolar.join(',') || null, p_alici: oz.alici || null, p_urun_sayisi: oz.urun || null });
      if (r && r.durum === 'alindi') y.durum = 'ok';
      else if (r && r.durum === 'zaten') y.durum = 'zaten';
      else { y.durum = 'hata'; y.alt = (r && (r.mesaj || (r.durum === 'kapali' ? 'Bu mağazaya sipariş gönderme kapalı' : ''))) || y.alt; }
    } catch (e) { y.durum = 'hata'; y.alt = e.message; }
    fisModalCiz();
  }
  await fisDurumYukle();
  const kok = document.getElementById('kok'), y0 = window.scrollY; ciz(); window.scrollTo(0, y0);
  fisModalCiz();
}
// Sayfanın herhangi bir yerine PDF bırakılınca da gönder
(() => {
  let sayac = 0;
  const kaplama = () => { let k = document.getElementById('surukleKaplama'); if (!k) { k = document.createElement('div'); k.id = 'surukleKaplama'; k.className = 'surukle-kaplama'; k.innerHTML = '<div style="font-size:54px">📄</div>Sipariş fişlerini bırakın'; document.body.appendChild(k); } return k; };
  const dosyaMi = e => FIS.acik && e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  window.addEventListener('dragenter', e => { if (!dosyaMi(e)) return; e.preventDefault(); sayac++; if (!document.querySelector('#fisModal[style*=flex]')) kaplama().classList.add('acik'); });
  window.addEventListener('dragover', e => { if (dosyaMi(e)) e.preventDefault(); });
  window.addEventListener('dragleave', e => { if (!dosyaMi(e)) return; if (--sayac <= 0) { sayac = 0; kaplama().classList.remove('acik'); } });
  window.addEventListener('drop', e => { if (!dosyaMi(e)) return; e.preventDefault(); sayac = 0; kaplama().classList.remove('acik'); if (!e.target.closest || !e.target.closest('#birakAlan')) fisDosyalar(e.dataTransfer.files); });
})();
window.addEventListener('hashchange', () => yukle());
document.addEventListener('visibilitychange', () => { if (!document.hidden && V) yukle(true); });
yukle();
</script>
